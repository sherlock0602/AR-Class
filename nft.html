<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR 無框模式 (修復版)</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
        .arjs-loader {
            height: 100%; width: 100%; position: absolute; top: 0; left: 0;
            background-color: rgba(0, 0, 0, 0.8); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
        }
        .arjs-loader div {
            text-align: center; font-size: 1.25em; color: white; font-family: sans-serif;
        }
    </style>
</head>

<body style="margin : 0px; overflow: hidden;">
    <div class="arjs-loader">
        <div>正在讀取圖片特徵...<br>(若卡住超過30秒代表路徑錯誤)</div>
    </div>

    <a-scene
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true;"
        embedded
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

        <a-nft
            type="nft"
            url="markers/rabbit"
            smooth="true"
            smoothCount="10"
            smoothTolerance=".01"
            smoothThreshold="5">
            
            <a-box position="50 0 -100" scale="100 100 100" color="red" opacity="0.6" animation="property: rotation; to: 0 360 0; loop: true; dur: 2000"></a-box>
            
        </a-nft>
        
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
