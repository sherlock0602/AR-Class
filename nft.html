<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>NFT 影片播放範例</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
        /* 讀取畫面樣式 */
        .arjs-loader {
            height: 100%; width: 100%; position: absolute; top: 0; left: 0;
            background-color: rgba(0, 0, 0, 0.8); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; font-family: sans-serif;
        }
        /* 播放按鈕 (手機版需要互動才能播影片) */
        #playButton {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 10px 20px; background: #FF5722; color: white; border: none;
            border-radius: 5px; font-size: 16px; cursor: pointer; display: none; z-index: 999;
        }
    </style>
</head>

<body style="margin : 0px; overflow: hidden;">
    
    <div class="arjs-loader">
        <div>正在讀取圖片特徵...<br>(image01)</div>
    </div>

    <button id="playButton">▶ 點擊開啟影片聲音</button>

    <a-scene
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true;"
        embedded
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

        <a-nft
            type="nft"
            url="https://sherlock0602.github.io/AR-Class/markers/image01"
            smooth="true"
            smoothCount="10"
            smoothTolerance=".01"
            smoothThreshold="5"
            id="nft-marker">
            
            <a-video
                src="assets/video01.mp4"
                id="ar-video"
                position="50 0 -100"
                scale="150 150 150"
                rotation="-90 0 0"
                webkit-playsinline
                playsinline
                loop="true">
            </a-video>
            
        </a-nft>
        
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // === 互動控制腳本 ===
        window.addEventListener('load', () => {
            const loader = document.querySelector('.arjs-loader');
            const playBtn = document.getElementById('playButton');
            const video = document.getElementById('ar-video'); // 這裡抓的是 a-video 元素
            const marker = document.getElementById('nft-marker');
            
            // 抓取實際的 video DOM (因為 a-frame 會包一層)
            // 我們需要直接控制最底層的 video 標籤才能確保播放
            let nativeVideo = null;

            // 等待 a-frame 載入完成來抓 video
            const checkVideo = setInterval(() => {
                // 在 a-assets 沒寫的情況下，a-video 會自己生成一個 video 標籤
                // 我們嘗試去抓它
                const v = document.querySelector('video'); 
                if (v && v.getAttribute('src').includes('video01')) {
                    nativeVideo = v;
                    clearInterval(checkVideo);
                    console.log("影片載入成功");
                    
                    // 影片載入後，隱藏 Loading，顯示播放按鈕
                    if(loader) loader.style.display = 'none';
                    if(playBtn) playBtn.style.display = 'block';
                }
            }, 500);

            // 點擊按鈕：解鎖聲音並播放
            playBtn.addEventListener('click', () => {
                if (nativeVideo) {
                    nativeVideo.play();
                    nativeVideo.pause(); // 先播再停，取得權限
                    playBtn.style.display = 'none'; // 隱藏按鈕
                }
            });

            // 掃描到圖片：播放
            marker.addEventListener('markerFound', () => {
                console.log("掃描到 image01 !");
                if (nativeVideo) nativeVideo.play();
            });

            // 移開圖片：暫停
            marker.addEventListener('markerLost', () => {
                console.log("丟失目標");
                if (nativeVideo) nativeVideo.pause();
            });
        });
    </script>
</body>
</html>
